# k8s/configmap.yaml
#
# 민감하지 않은 설정값만 담는다. 비밀값(API Key, 비밀번호, 접속 문자열)은
# secret.yaml 쪽으로 분리했다 — ConfigMap은 평문으로 저장되고 `kubectl get
# configmap -o yaml`로 누구나 볼 수 있기 때문이다.
#
# 여기 적힌 키 이름은 backend/config/settings.py, services/mongo_service.py,
# services/ai/ai_factory.py, prompts/embedding/embed_provider.py가 os.environ으로
# 그대로 읽는 이름과 정확히 같아야 한다(코드 수정 없이 값만 주입되는 구조).

apiVersion: v1
kind: ConfigMap
metadata:
  name: popup-chatbot-backend-config
  namespace: default
data:
  # --- Redis (같은 클러스터의 cpu-cache-ns 네임스페이스에 이미 배포되어 있음, 인증 없음) ---
  REDIS_HOST: "redis-svc.cpu-cache-ns.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TTL_SECONDS: "3600"
  REDIS_TIMEOUT_SECONDS: "1.5"
  CACHE_ENABLED: "true"

  # --- MongoDB (같은 클러스터의 cpu-data-ns 네임스페이스에 이미 배포되어 있음, 인증 없음,
  #     기존 운영 데이터가 이미 마이그레이션되어 있는 상태) ---
  # 인증 정보가 없는 순수 접속 문자열이라 여기(비민감 ConfigMap)에 둔다.
  # 나중에 인증이 추가되면 user:pass가 포함되므로 secret.yaml로 옮겨야 한다.
  MONGODB_URI: "mongodb://mongodb-headless.cpu-data-ns.svc.cluster.local:27017"

  # --- Lambda (API Gateway 경유) ---
  # 2026-07-30 sam deploy(stack: popup-chatbot)로 배포된 실제 invoke URL
  LAMBDA_API_URL: "https://lcnlc3wive.execute-api.ap-northeast-2.amazonaws.com/Prod/chat"
  LAMBDA_TIMEOUT_SECONDS: "30"

  # --- AI Provider (레거시 /chatbot/search, /chatbot/ai-search 엔드포인트가 사용) ---
  AI_PROVIDER: "openai"
  EMBEDDING_PROVIDER: "openai"

  # --- Logging ---
  LOG_LEVEL: "INFO"
