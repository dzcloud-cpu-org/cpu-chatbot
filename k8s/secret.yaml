# k8s/secret.yaml
#
# ⚠ 이 파일은 값을 채운 채로 git에 커밋하지 않는다. 아래 placeholder 그대로
# 구조 참고용으로만 두고, 실제 값은 배포 시점에 다음 중 하나로 주입한다.
#
#   1) kubectl 명령으로 직접 생성(가장 간단, 이 파일 자체는 적용하지 않음):
#        kubectl create secret generic popup-chatbot-backend-secret \
#          --from-literal=OPENAI_API_KEY='...' \
#          --from-literal=MONGODB_URI='mongodb://user:pass@mongodb.default.svc.cluster.local:27017' \
#          --from-literal=REDIS_PASSWORD='...' \
#          --from-literal=LAMBDA_API_KEY='...' \
#          -n default
#
#   2) 운영 환경이라면 External Secrets Operator / Sealed Secrets 등으로
#      AWS Secrets Manager·Parameter Store와 동기화하는 것을 권장한다
#      (git에 평문/암호문 형태로도 두지 않는 것이 이상적).
#
# stringData를 쓰면 이 파일 자체는 사람이 읽는 평문 형태로 보이므로,
# 실사용 시에는 반드시 위 방법으로 대체하고 이 파일에는 값을 채우지 않는다.

apiVersion: v1
kind: Secret
metadata:
  name: popup-chatbot-backend-secret
  namespace: default
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  MONGODB_URI: "REPLACE_ME"          # mongodb://<user>:<pass>@mongodb.default.svc.cluster.local:27017
  REDIS_PASSWORD: "REPLACE_ME"        # Redis에 인증이 없다면 빈 문자열로 둬도 된다
  LAMBDA_API_KEY: "REPLACE_ME"        # API Gateway x-api-key 값
